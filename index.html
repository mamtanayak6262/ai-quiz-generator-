
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QUIZ MASTER AI</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
font-family:Arial,sans-serif;
background:#080d1d;
color:white;
min-height:100vh;
}

header{
background:#111b31;
padding:20px 7%;
display:flex;
justify-content:space-between;
align-items:center;
border-bottom:1px solid #293958;
}

.logo{
font-size:25px;
font-weight:bold;
color:#43dcff;
}

.logo span{color:#a78bfa}

.tag{
background:#163b36;
color:#4ade80;
padding:9px 13px;
border-radius:20px;
font-size:12px;
}

.container{
max-width:900px;
margin:45px auto;
padding:15px;
}

.hero{text-align:center;margin-bottom:30px}

.hero h1{font-size:39px;margin-bottom:12px}

.hero h1 span{
color:#42d9ff;
}

.hero p{color:#aab5cd;line-height:1.6}

.card{
background:#111c32;
border:1px solid #293958;
border-radius:17px;
padding:25px;
margin-bottom:20px;
}

h2{margin-bottom:15px}

label{
display:block;
margin:17px 0 9px;
color:#d9e7ff;
font-weight:bold;
}

input,select{
width:100%;
padding:14px;
border-radius:9px;
background:#081326;
border:1px solid #344765;
color:white;
outline:none;
font-size:15px;
}

input:focus,select:focus{border-color:#43dcff}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:15px;
}

button{
border:none;
padding:14px;
border-radius:9px;
cursor:pointer;
font-weight:bold;
font-size:15px;
}

.generate{
width:100%;
margin-top:23px;
background:linear-gradient(90deg,#06bce8,#7655f6);
color:white;
}

button:disabled{opacity:.6;cursor:wait}

#status{
text-align:center;
margin-top:16px;
color:#42d9ff;
overflow-wrap:anywhere;
}

.hidden{display:none}

.question{
background:#111c32;
padding:22px;
border:1px solid #293958;
border-radius:14px;
margin-bottom:18px;
}

.question h3{line-height:1.5;margin-bottom:15px}

.option{
display:flex;
align-items:center;
gap:10px;
background:#091426;
border:1px solid #344765;
padding:13px;
margin:9px 0;
border-radius:9px;
cursor:pointer;
}

.option input{width:auto}

.option.correct{
background:#123c2b;
border-color:#22c55e;
}

.option.wrong{
background:#421e28;
border-color:#ef4444;
}

.explanation{
display:none;
margin-top:12px;
padding:13px;
background:#1c2d47;
border-radius:8px;
color:#d0e2ff;
line-height:1.5;
}

#result{
display:none;
text-align:center;
padding:25px;
background:#142b42;
border-radius:15px;
margin-top:20px;
}

.score{
font-size:45px;
color:#43dcff;
margin:15px;
font-weight:bold;
}

.secondary{
background:#263b59;
color:white;
margin-top:15px;
}

footer{
text-align:center;
padding:30px;
color:#75849f;
}

@media(max-width:550px){
.hero h1{font-size:29px}
.grid{grid-template-columns:1fr}
.card{padding:18px}
header{padding:17px}
}
</style>
</head>

<body>

<header>
<div class="logo">QUIZ <span>MASTER AI</span></div>
<div class="tag">✦ FREE AI MODEL</div>
</header>

<div class="container">

<div class="hero">
<h1>AI Quiz <span>Generator</span></h1>
<p>Generate smart quizzes on any topic using AI.</p>
</div>

<div class="card" id="setup">

<h2>🚀 Create Your Quiz</h2>

<label>Groq API Key</label>
<input type="password" id="apiKey" placeholder="Paste your Groq API key">

<label>Quiz Topic</label>
<input type="text" id="topic" placeholder="Example: Science, Computer, History">

<div class="grid">

<div>
<label>Difficulty</label>
<select id="difficulty">
<option>Easy</option>
<option selected>Medium</option>
<option>Hard</option>
</select>
</div>

<div>
<label>Questions</label>
<select id="count">
<option value="5">5 Questions</option>
<option value="10">10 Questions</option>
<option value="20">20 Questions</option>
</select>
</div>

</div>

<label>AI Model</label>
<select id="model">
<option value="openai/gpt-oss-120b">GPT-OSS 120B</option>
<option value="openai/gpt-oss-20b">GPT-OSS 20B</option>
</select>

<button class="generate" id="generateBtn" onclick="generateQuiz()">
✨ GENERATE QUIZ
</button>

<div id="status"></div>

</div>

<div id="quizArea" class="hidden">

<div class="card">
<h2 id="quizTitle">Your Quiz</h2>
<p id="quizInfo" style="color:#aab5cd"></p>
</div>

<div id="questions"></div>

<button class="generate" id="submitBtn" onclick="submitQuiz()">
SUBMIT ANSWERS
</button>

<div id="result">
<h2>🎉 Quiz Completed!</h2>
<div class="score" id="score"></div>
<p id="message"></p>
<button class="secondary" onclick="resetQuiz()">Create New Quiz</button>
</div>

</div>

</div>

<footer>
QUIZ MASTER AI © 2026 | Powered by Groq
</footer>

<script>

let quizData=[];
let submitted=false;

async function generateQuiz(){

const key=document.getElementById("apiKey").value.trim();
const topic=document.getElementById("topic").value.trim();
const difficulty=document.getElementById("difficulty").value;
const count=Number(document.getElementById("count").value);
const model=document.getElementById("model").value;

const status=document.getElementById("status");
const btn=document.getElementById("generateBtn");

if(!key){
alert("Please enter Groq API Key!");
return;
}

if(!topic){
alert("Please enter a topic!");
return;
}

btn.disabled=true;
status.innerText="⏳ AI is generating your quiz...";

try{

const prompt=`
Create exactly ${count} multiple choice quiz questions
about "${topic}" at ${difficulty} difficulty.

Return ONLY valid JSON:
{
"title":"Quiz title",
"questions":[
{
"question":"Question",
"options":["Option A","Option B","Option C","Option D"],
"answer":0,
"explanation":"Explanation"
}
]
}

Rules:
1. Exactly ${count} questions.
2. Exactly 4 options per question.
3. Answer must be a number from 0 to 3.
4. Questions must be factually accurate.
5. No repeated questions.
6. Explanations must be short.
7. Return JSON only. No markdown.
`;

const response=await fetch(
"https://api.groq.com/openai/v1/chat/completions",
{
method:"POST",
headers:{
"Content-Type":"application/json",
"Authorization":"Bearer "+key
},
body:JSON.stringify({
model:model,
messages:[
{
role:"system",
content:"You are a professional educational quiz generator. Always return valid JSON only."
},
{
role:"user",
content:prompt
}
],
temperature:0.5,
max_tokens:6000
})
}
);

const data=await response.json();

if(!response.ok){
throw new Error(data.error?.message || "API error");
}

let output=data.choices?.[0]?.message?.content;

if(!output)throw new Error("No response from AI");

output=output.replace(/```json/gi,"").replace(/```/g,"").trim();

const start=output.indexOf("{");
const end=output.lastIndexOf("}");

if(start<0 || end<0)throw new Error("Invalid AI response");

const result=JSON.parse(output.slice(start,end+1));

if(!Array.isArray(result.questions) ||
result.questions.length!==count){
throw new Error("AI returned an incorrect question count. Try again.");
}

result.questions.forEach(q=>{
if(
typeof q.question!=="string" ||
!Array.isArray(q.options) ||
q.options.length!==4 ||
!Number.isInteger(q.answer) ||
q.answer<0 ||
q.answer>3
){
throw new Error("Invalid question received. Try again.");
}
});

quizData=result.questions;
submitted=false;

document.getElementById("setup").classList.add("hidden");
document.getElementById("quizArea").classList.remove("hidden");

document.getElementById("quizTitle").textContent=result.title || topic+" Quiz";
document.getElementById("quizInfo").textContent=
count+" Questions | "+difficulty+" | "+model;

renderQuestions();

status.innerText="";

}catch(error){

status.innerText="❌ "+error.message;

}finally{

btn.disabled=false;
btn.innerText="✨ GENERATE QUIZ";

}

}

function renderQuestions(){

const container=document.getElementById("questions");
container.innerHTML="";

quizData.forEach((q,index)=>{

const card=document.createElement("div");
card.className="question";

const heading=document.createElement("h3");
heading.textContent=(index+1)+". "+q.question;
card.appendChild(heading);

q.options.forEach((option,i)=>{

const label=document.createElement("label");
label.className="option";

const radio=document.createElement("input");
radio.type="radio";
radio.name="q"+index;
radio.value=i;

label.appendChild(radio);
label.appendChild(document.createTextNode(option));
card.appendChild(label);

});

const explanation=document.createElement("div");
explanation.className="explanation";
explanation.id="explanation"+index;
card.appendChild(explanation);

container.appendChild(card);

});

}

function submitQuiz(){

if(submitted)return;

let score=0;

quizData.forEach((q,index)=>{

const selected=document.querySelector(
'input[name="q'+index+'"]:checked'
);

const card=document.getElementById("questions").children[index];
const labels=card.querySelectorAll(".option");

labels.forEach((label,i)=>{

const radio=label.querySelector("input");
radio.disabled=true;

if(i===q.answer){
label.classList.add("correct");
}

if(selected &&
i===Number(selected.value) &&
i!==q.answer){
label.classList.add("wrong");
}

});

if(selected && Number(selected.value)===q.answer){
score++;
}

const explanation=document.getElementById("explanation"+index);

explanation.style.display="block";
explanation.textContent=
"Explanation: "+(q.explanation || "See the correct answer above.");

});

submitted=true;

const percent=Math.round(score/quizData.length*100);

document.getElementById("score").textContent=
score+" / "+quizData.length;

document.getElementById("message").textContent=
"Your Result: "+percent+"%";

document.getElementById("result").style.display="block";
document.getElementById("submitBtn").style.display="none";

document.getElementById("result").scrollIntoView({
behavior:"smooth"
});

}

function resetQuiz(){

quizData=[];
submitted=false;

document.getElementById("quizArea").classList.add("hidden");
document.getElementById("setup").classList.remove("hidden");
document.getElementById("questions").innerHTML="";
document.getElementById("result").style.display="none";
document.getElementById("submitBtn").style.display="block";
document.getElementById("status").innerText="";

}

</script>

</body>
</html>
